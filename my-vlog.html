<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY VLOG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #16181c;
    --bg-soft: #1e2126;
    --text: #f1efe9;
    --muted: #9a9da3;
    --accent: #e8a33d;
    --line: rgba(241,239,233,0.10);
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 48px 20px;
    background-image:
      radial-gradient(circle at 50% 0%, rgba(232,163,61,0.10), transparent 55%);
  }

  .page{
    width: 100%;
    max-width: 860px;
  }

  .eyebrow{
    display:flex;
    align-items:center;
    gap:10px;
    justify-content:center;
    margin-bottom: 14px;
  }

  .eyebrow .dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background: var(--accent);
    box-shadow: 0 0 12px 2px rgba(232,163,61,0.6);
  }

  .eyebrow span{
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  h1{
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    font-size: clamp(40px, 7vw, 72px);
    text-align:center;
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 36px;
  }

  h1 .glow{
    color: var(--accent);
  }

  .video-frame{
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 15px;
    overflow: hidden;
    background: #000;
    border: 1px solid var(--line);
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.6),
      0 0 0 1px rgba(255,255,255,0.02);
  }

  .video-frame video{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Placeholder tampil sampai video sungguhan dipasang */
  .video-frame .placeholder{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    color: var(--muted);
    font-size: 14px;
    background:
      linear-gradient(135deg, #1e2126 0%, #16181c 100%);
    pointer-events:none;
  }

  .placeholder strong{
    color: var(--text);
    font-family:'Bricolage Grotesque', sans-serif;
    font-weight:600;
    font-size:16px;
  }

  .description{
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
  }

  .description h2{
    font-family:'Bricolage Grotesque', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-bottom: 10px;
    color: var(--text);
  }

  .description p{
    color: var(--muted);
    font-size: 15px;
    line-height: 1.7;
    max-width: 70ch;
  }

  .description p + p{
    margin-top: 10px;
  }

  .meta{
    display:flex;
    gap:16px;
    margin-top:18px;
    flex-wrap:wrap;
  }

  .meta span{
    font-size: 12px;
    color: var(--muted);
    background: var(--bg-soft);
    border: 1px solid var(--line);
    padding: 6px 12px;
    border-radius: 999px;
  }

  @media (prefers-reduced-motion: reduce){
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

  <div class="page">

    <div class="eyebrow">
      <div class="dot"></div>
      <span>Video</span>
    </div>

    <h1>MY <span class="glow">VLOG</span></h1>

    <div class="video-frame">
      <!--
        GANTI VIDEO DI SINI:
        Ganti "src/video-kamu.mp4" di bawah dengan path/URL video kamu sendiri.
        Kamu juga bisa menambahkan atribut poster="thumbnail.jpg" pada tag <video>
        untuk menampilkan gambar sampul sebelum video diputar.
      -->
      <video controls preload="metadata">
        <source src="assets/video/myvideo.mp4" type="video/mp4">
      </video>
    </div>

    <div class="description">
      <h2>Tentang video ini</h2>
      <p>
        disini saya menjelaskan mengenai kelebihan website saya, dan kenapa kalian harus mengunjungi website saya.
      </p>
  </div>

</body>
</html>
